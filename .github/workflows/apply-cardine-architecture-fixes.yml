name: Apply Cardine architecture fixes

on:
  push:
    branches:
      - agent/cardine-architecture-reliability-latency
    paths:
      - .github/workflows/apply-cardine-architecture-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: agent/cardine-architecture-reliability-latency
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Reconstruct and apply exact source changes
        shell: bash
        run: |
          cat \
            dev/.apply-cardine-fixes.00 \
            dev/.apply-cardine-fixes.01 \
            dev/.apply-cardine-fixes.02 \
            dev/.apply-cardine-fixes.030 \
            dev/.apply-cardine-fixes.031 \
            dev/.apply-cardine-fixes.04 \
            > /tmp/apply-cardine-fixes.b64
          echo '9fdf2b8464675de1cfa09c6c48b573c2f413214ab12c6d765f3aa9eee866d177  /tmp/apply-cardine-fixes.b64' | sha256sum --check --strict
          base64 --decode /tmp/apply-cardine-fixes.b64 | gzip --decompress > /tmp/apply_cardine_architecture_fixes.py
          echo '6b0b1509838f2f79024ded5362c4db0a86e8fa8bb59afa64febe59a9032f88d0  /tmp/apply_cardine_architecture_fixes.py' | sha256sum --check --strict
          python -m py_compile /tmp/apply_cardine_architecture_fixes.py
          python /tmp/apply_cardine_architecture_fixes.py
      - name: Install locked development environment
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.9.15'
          uv sync --frozen --extra dev
      - name: Format changed Python files
        run: |
          uv run --frozen --extra dev python -m ruff format \
            src/study_agent/ports/model.py \
            src/study_agent/adapters/model/openai_compatible.py \
            src/study_agent/playbooks/engine.py \
            src/study_agent/capabilities/contracts.py \
            src/study_agent/capabilities/gateway.py \
            src/study_agent/capabilities/worker_adapter.py \
            src/cardine/application/conversation_turn.py \
            src/cardine/application/flashcard_proposals.py \
            src/cardine/hosts/runner.py \
            src/cardine/hosts/flashcard_routing.py \
            src/cardine/hosts/source_grounding.py \
            src/cardine/hosts/clarification_recovery.py \
            src/cardine/hosts/scope_resolution.py \
            src/cardine/cli/repository.py \
            tests/unit/adapters/model/test_openai_provider_schema_projection.py \
            tests/unit/hosts/test_effect_fast_paths.py \
            tests/unit/hosts/test_scope_resolution.py \
            tests/unit/cardine/test_flashcard_failure_taxonomy.py
      - name: Lint changed files
        run: |
          uv run --frozen --extra dev python -m ruff check \
            src/study_agent/ports/model.py \
            src/study_agent/adapters/model/openai_compatible.py \
            src/study_agent/playbooks/engine.py \
            src/study_agent/capabilities/contracts.py \
            src/study_agent/capabilities/gateway.py \
            src/study_agent/capabilities/worker_adapter.py \
            src/cardine/application/conversation_turn.py \
            src/cardine/application/flashcard_proposals.py \
            src/cardine/hosts/runner.py \
            src/cardine/hosts/flashcard_routing.py \
            src/cardine/hosts/source_grounding.py \
            src/cardine/hosts/clarification_recovery.py \
            src/cardine/hosts/scope_resolution.py \
            src/cardine/cli/repository.py \
            tests/unit/adapters/model/test_openai_provider_schema_projection.py \
            tests/unit/hosts/test_effect_fast_paths.py \
            tests/unit/hosts/test_scope_resolution.py \
            tests/unit/cardine/test_flashcard_failure_taxonomy.py
      - name: Type-check changed modules
        run: |
          MYPYPATH=src uv run --frozen --extra dev python -m mypy --explicit-package-bases \
            src/study_agent/ports/model.py \
            src/study_agent/adapters/model/openai_compatible.py \
            src/study_agent/playbooks/engine.py \
            src/study_agent/capabilities/contracts.py \
            src/study_agent/capabilities/gateway.py \
            src/study_agent/capabilities/worker_adapter.py \
            src/cardine/application/conversation_turn.py \
            src/cardine/application/flashcard_proposals.py \
            src/cardine/hosts/runner.py \
            src/cardine/hosts/flashcard_routing.py \
            src/cardine/hosts/source_grounding.py \
            src/cardine/hosts/clarification_recovery.py \
            src/cardine/hosts/scope_resolution.py \
            src/cardine/cli/repository.py
      - name: Focused regression suite
        run: |
          uv run --frozen --extra dev python -m pytest -q \
            tests/unit/adapters/model/test_openai_compatible.py \
            tests/unit/adapters/model/test_openai_luna.py \
            tests/unit/adapters/model/test_tutor_decision.py \
            tests/unit/adapters/model/test_openai_provider_schema_projection.py \
            tests/unit/hosts/test_flashcard_routing_natural_language.py \
            tests/unit/hosts/test_source_grounding.py \
            tests/unit/hosts/test_effect_fast_paths.py \
            tests/unit/hosts/test_scope_resolution.py \
            tests/unit/cardine/test_flashcard_failure_taxonomy.py \
            tests/unit/cardine/test_a2_regressions.py \
            tests/unit/flashcards/test_lesson_worker_service.py \
            tests/integration/demo/TUT08/test_flashcard_proposals.py
      - name: Verify and publish implementation commit
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/apply-cardine-architecture-fixes.yml
          rm dev/.apply-cardine-fixes.*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(cardine): enforce reliable effect execution'
          git push origin HEAD:agent/cardine-architecture-reliability-latency
