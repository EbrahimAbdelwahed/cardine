name: Review Cardine architecture fixes

on:
  push:
    branches:
      - agent/cardine-architecture-reliability-latency
    paths:
      - .github/workflows/review-cardine-architecture-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: agent/cardine-architecture-reliability-latency
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply final review corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/cardine/hosts/flashcard_routing.py')
          source = path.read_text()
          old = '''        observed_history = _observed_conversation_history(context)
          if not observed_history and (
              _HISTORY_SCOPED.search(learner_text)
              and _omitted_conversation_entries(context) > 0
              and _has_conversation_read_tool(context)
          ):
              return InvokeToolDecision(
                  "conversation.read",
                  {
                      "cursor": _oldest_included_conversation_sequence(context),
                      "direction": "backward",
                      "limit": 12,
                  },
              )
          if observed_history:
          '''
          new = '''        observed_history = _observed_conversation_history(context)
          history_scoped = _HISTORY_SCOPED.search(learner_text) is not None
          if history_scoped and not observed_history:
              if (
                  _omitted_conversation_entries(context) > 0
                  and _has_conversation_read_tool(context)
              ):
                  return InvokeToolDecision(
                      "conversation.read",
                      {
                          "cursor": _oldest_included_conversation_sequence(context),
                          "direction": "backward",
                          "limit": 12,
                      },
                  )
              decision = await self._delegate.decide(context, interruption)
              if isinstance(decision, InvokeToolDecision):
                  return decision
              if (
                  isinstance(decision, StartCapabilityDecision)
                  and decision.capability_id == _PROPOSE_FLASHCARDS
              ):
                  return decision
              return AskLearnerDecision(
                  "Quali argomenti della conversazione devo trasformare in flashcard?"
              )
          if observed_history:
          '''
          if old not in source:
              raise SystemExit('flashcard history routing seam changed')
          path.write_text(source.replace(old, new, 1))

          path = Path('src/cardine/application/conversation_turn.py')
          source = path.read_text()
          old = '''                if presentation is None:
                  presentation = self._record_fallback_presentation(
                      context.course_id,
                      session_id,
                      host_turn_id,
                      command.content,
                      pending_fingerprint,
                      host_result.status,
                      learner,
                      service_context,
                      presentation_key,
                      failure_reason=host_result.failure_reason,
                  )
          '''
          new = '''                if presentation is None:
                  presentation = self._record_fallback_presentation(
                      context.course_id,
                      session_id,
                      host_turn_id,
                      command.content,
                      pending_fingerprint,
                      host_result.status,
                      learner,
                      service_context,
                      presentation_key,
                      failure_reason="publication_failed",
                  )
          '''
          if old not in source:
              raise SystemExit('completion publication seam changed')
          path.write_text(source.replace(old, new, 1))

          path = Path('src/cardine/cli/repository.py')
          source = path.read_text()
          old = '''_SCOPE_FAILURE_MESSAGE = (
              "Non sono riuscito a mantenere il riferimento alla lezione o alla fonte selezionata. "
              "Seleziona di nuovo la lezione e riprova."
          )
          '''
          new = old + '''_PUBLICATION_FAILURE_MESSAGE = (
              "Il lavoro è stato completato, ma Cardine non è riuscito a pubblicarne il risultato. "
              "Il contenuto non verrà rigenerato automaticamente."
          )
          '''
          if old not in source:
              raise SystemExit('fallback message constants seam changed')
          source = source.replace(old, new, 1)
          old = '''    if failure_reason in {"scope_missing", "scope_stale"}:
              return _SCOPE_FAILURE_MESSAGE
          if status in {TutorHostRunStatus.TERMINATED, TutorHostRunStatus.STOPPED}:
          '''
          new = '''    if failure_reason in {"scope_missing", "scope_stale"}:
              return _SCOPE_FAILURE_MESSAGE
          if failure_reason == "publication_failed":
              return _PUBLICATION_FAILURE_MESSAGE
          if status in {TutorHostRunStatus.TERMINATED, TutorHostRunStatus.STOPPED}:
          '''
          if old not in source:
              raise SystemExit('fallback policy seam changed')
          path.write_text(source.replace(old, new, 1))

          path = Path('tests/unit/hosts/test_effect_fast_paths.py')
          source = path.read_text()
          addition = '''

          def test_history_scoped_flashcards_with_complete_window_use_one_model_call() -> None:
              expected = StartCapabilityDecision(
                  "propose_flashcards",
                  {
                      "query": "glicolisi",
                      "scope": "glicolisi",
                      "language": "it",
                      "candidate_ceiling": 12,
                      "continuation_summary_json": None,
                  },
              )
              delegate = _CountingPort(expected)

              decision = asyncio.run(
                  FlashcardProfileRoutingTutorDecisionPort(delegate).decide(
                      _context("Crea flashcard su quello che abbiamo discusso finora"),
                      _Token(),
                  )
              )

              assert decision == expected
              assert delegate.calls == 1


          def test_history_scoped_model_promise_cannot_complete_the_effect() -> None:
              delegate = _CountingPort()

              decision = asyncio.run(
                  FlashcardProfileRoutingTutorDecisionPort(delegate).decide(
                      _context("Crea flashcard su quello che abbiamo discusso finora"),
                      _Token(),
                  )
              )

              assert not isinstance(decision, AssistantMessageDecision)
              assert delegate.calls == 1
          '''
          if 'test_history_scoped_flashcards_with_complete_window_use_one_model_call' in source:
              raise SystemExit('history-scoped regression already exists')
          path.write_text(source + addition)

          path = Path('tests/unit/cardine/test_flashcard_failure_taxonomy.py')
          source = path.read_text()
          marker = '''from cardine.application.flashcard_proposals import (
              _failure_reason,
              _worker_failure_reason,
          )
          '''
          replacement = marker + '''from cardine.cli.repository import _cardine_fallback_message
          from cardine.hosts import TutorHostRunStatus
          '''
          if marker not in source:
              raise SystemExit('failure taxonomy imports seam changed')
          source = source.replace(marker, replacement, 1)
          addition = '''

          def test_publication_failure_is_not_reported_as_execution_or_evidence_failure() -> None:
              message = _cardine_fallback_message(
                  TutorHostRunStatus.COMPLETED,
                  "publication_failed",
              )

              assert "completato" in message
              assert "pubblicarne" in message
          '''
          if 'test_publication_failure_is_not_reported_as_execution_or_evidence_failure' in source:
              raise SystemExit('publication failure regression already exists')
          path.write_text(source + addition)
          PY
      - name: Install locked development environment
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.9.15'
          uv sync --frozen --extra dev
      - name: Format, lint, and type-check review changes
        run: |
          uv run --frozen --extra dev python -m ruff format \
            src/cardine/hosts/flashcard_routing.py \
            src/cardine/application/conversation_turn.py \
            src/cardine/cli/repository.py \
            tests/unit/hosts/test_effect_fast_paths.py \
            tests/unit/cardine/test_flashcard_failure_taxonomy.py
          uv run --frozen --extra dev python -m ruff check \
            src/cardine/hosts/flashcard_routing.py \
            src/cardine/application/conversation_turn.py \
            src/cardine/cli/repository.py \
            tests/unit/hosts/test_effect_fast_paths.py \
            tests/unit/cardine/test_flashcard_failure_taxonomy.py
          MYPYPATH=src uv run --frozen --extra dev python -m mypy --explicit-package-bases \
            src/cardine/hosts/flashcard_routing.py \
            src/cardine/application/conversation_turn.py \
            src/cardine/cli/repository.py
      - name: Run focused and architectural regressions
        run: |
          uv run --frozen --extra dev python -m pytest -q \
            tests/unit/adapters/model/test_openai_compatible.py \
            tests/unit/adapters/model/test_openai_luna.py \
            tests/unit/adapters/model/test_tutor_decision.py \
            tests/unit/adapters/model/test_openai_provider_schema_projection.py \
            tests/unit/application/test_conversation_turn.py \
            tests/unit/hosts/test_flashcard_routing_natural_language.py \
            tests/unit/hosts/test_source_grounding.py \
            tests/unit/hosts/test_effect_fast_paths.py \
            tests/unit/hosts/test_scope_resolution.py \
            tests/unit/cardine/test_flashcard_failure_taxonomy.py \
            tests/unit/cardine/test_a2_regressions.py \
            tests/unit/flashcards/test_lesson_worker_service.py \
            tests/integration/demo/TUT08/test_flashcard_proposals.py
      - name: Publish reviewed implementation
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/review-cardine-architecture-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(cardine): preserve scoped intent and publication state'
          git push origin HEAD:agent/cardine-architecture-reliability-latency
