name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      # Keep the resolver and every development tool reproducible from uv.lock.
      - run: python -m pip install --disable-pip-version-check 'uv==0.9.15'
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev python -m pytest
      - run: uv run --frozen --extra dev python -m ruff check .
      - run: uv run --frozen --extra dev python -m mypy
      - run: uv run --frozen --extra dev python -m build --wheel --sdist --outdir dist
      - run: uv run --frozen --extra dev python scripts/verify_cardine_wheel.py dist/cardine-*.whl dist/cardine-*.tar.gz
      - run: python -m venv clean-install
      - run: clean-install/bin/python -m pip install --disable-pip-version-check dist/*.whl
      - name: Verify provider-free semantic core imports
        run: >-
          clean-install/bin/python -c
          'import importlib.util;
          assert importlib.util.find_spec("httpx") is None;
          from study_agent.flashcards.semantic import FlashcardSemanticAnalyzer;
          from study_agent.adapters.judgement.jev import JevChoiceAdapter;
          from cardine.adapters.document_index.pageindex import PageIndexDocumentIndexAdapter;
          from cardine.hosts.routing import RoutingTutorDecisionPort'
      - run: clean-install/bin/cardine --help
      - run: clean-install/bin/cardine-demo
      - run: clean-install/bin/cardine-shell --json
      - run: clean-install/bin/cardine --json describe
      - run: >-
          clean-install/bin/cardine --json operator skill
          --output clean-install/extracted/study-agent-operator/SKILL.md
      - run: >-
          clean-install/bin/python -c
          'import importlib.resources;
          root = importlib.resources.files("study_agent");
          skill = importlib.resources.files("study_agent.operator_skill").joinpath("SKILL.md");
          assert root.joinpath("py.typed").is_file();
          assert skill.is_file();
          assert skill.read_bytes() == open("clean-install/extracted/study-agent-operator/SKILL.md", "rb").read()'
      - run: >-
          clean-install/bin/python docs/examples/external_agent.py
          clean-install/example-project
        env:
          CARDINE_BIN: ${{ github.workspace }}/clean-install/bin/cardine

  streaming:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check 'uv==0.9.15'
      - run: uv sync --frozen --extra dev --extra openai
      # Mocked SSE only: no provider calls, API keys or model spend.
      - run: >-
          uv run --frozen --extra dev --extra openai python -m pytest
          tests/unit/adapters/model/test_openai_luna.py
          tests/unit/adapters/model/test_native_streaming.py
          tests/integration/demo/TUT08/test_live_output.py

  recall:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check 'uv==0.9.15'
      - run: uv sync --frozen --extra dev --extra recall
      - run: >-
          uv run --frozen --extra dev --extra recall python -m pytest
          tests/unit/adapters/scheduling/test_py_fsrs.py
          tests/integration/test_recall_real_fsrs_e2e.py
          tests/architecture/test_fsrs_adapter_boundaries.py
          tests/architecture/test_recall_boundaries.py
      - run: >-
          uv run --frozen --extra dev --extra recall
          python -m build --wheel --outdir dist
      - run: python -m venv clean-recall-install
      - run: >-
          clean-recall-install/bin/python -m pip install
          --disable-pip-version-check dist/*.whl fsrs==6.3.1
      - run: >-
          clean-recall-install/bin/python -c
          'from datetime import UTC, datetime;
          from study_agent.adapters.scheduling.py_fsrs import PyFsrsSchedulingPolicy;
          from study_agent.domain import ArtifactRevisionId;
          from study_agent.recall.contracts import SchedulingPolicyConfigV1, SchedulingRequest;
          request = SchedulingRequest(ArtifactRevisionId("clean-wheel"), datetime(2026, 7, 24, tzinfo=UTC), (), SchedulingPolicyConfigV1());
          result = PyFsrsSchedulingPolicy().decide(request);
          assert result.implementation_version == "6.3.1"'

  pdf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check 'uv==0.9.15'
      - run: uv sync --frozen --extra dev --extra pdf
      - run: >-
          uv run --frozen --extra dev --extra pdf python -m pytest
          tests/integration/adapters/workarounds/test_pdf_markdown_real.py
          tests/adversarial/adapters/workarounds/test_worker_renderer_architecture.py
      - run: >-
          uv run --frozen --extra dev --extra pdf
          python -m build --wheel --outdir dist
      - run: python -m venv clean-pdf-install
      - run: >-
          clean-pdf-install/bin/python -m pip install
          --disable-pip-version-check dist/*.whl pypdf==6.14.2
      - run: >-
          cd /tmp &&
          ${{ github.workspace }}/clean-pdf-install/bin/python -c
          'import base64,pypdf; from study_agent.adapters.workarounds.worker import parse_in_worker; output=parse_in_worker(base64.b64decode(""),5.0); assert b"Hello PDF" in output and pypdf.__version__=="6.14.2" and parse_in_worker.__module__=="study_agent.adapters.workarounds.worker"'

  anydoc:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require qualified native containment
        run: >-
          python -c 'import platform, shutil, sys;
          assert sys.platform == "darwin" and platform.machine() == "arm64";
          assert shutil.which("sandbox-exec") == "/usr/bin/sandbox-exec"'
      - run: python -m pip install --disable-pip-version-check 'uv==0.9.15'
      - run: uv sync --frozen --extra dev
      - name: Diagnose sandbox Python startup
        run: |
          uv run --frozen --extra dev python - <<'PY_STARTUP'
          import os, subprocess, sys, tempfile
          from pathlib import Path
          from cardine.documents.anydoc_runtime import _sandbox_profile, _worker_python
          with tempfile.TemporaryDirectory() as private:
              executable = str(_worker_python())
              args = ["/usr/bin/sandbox-exec", "-D", "PYTHON_ROOT=" + str(Path(sys.base_prefix).resolve()),
                      "-D", "PRIVATE_ROOT=" + str(Path(private).resolve()), "-D", "PYTHON=" + executable,
                      "-p", _sandbox_profile(python=Path(executable), private=Path(private).resolve()), executable, "-I", "-S", "-B", "-c", "import encodings; print('sandbox startup OK')"]
              print("Python runtime:", sys.base_prefix, executable)
              result = subprocess.run(args, env={"PATH": "/usr/bin:/bin", "TMPDIR": private}, capture_output=True, text=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 0
          PY_STARTUP
      - name: Native PDF import and containment contracts
        run: >-
          uv run --frozen --extra dev python -m pytest
          tests/unit/cardine/documents/test_anydoc_worker.py
          tests/integration/demo/TUT08/test_repository_backed_chat.py::test_repository_pdf_import_is_canonical_and_restart_safe
          tests/integration/test_reference_cli_release.py::test_cli_admits_pdf_through_the_same_canonical_source_ledger

  jev:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check 'uv==0.9.15'
      - run: uv sync --frozen --extra dev --extra jev
      # Native OpenRouter HTTP tests use MockTransport; no API key or provider spend.
      - run: >-
          uv run --frozen --extra dev --extra jev python -m pytest
          tests/unit/adapters/judgement/test_jev.py
          tests/unit/adapters/document_index/test_pageindex.py
          tests/unit/knowledge/test_document_index.py
          tests/unit/ports/test_choice_judgement.py
          tests/unit/flashcards/test_semantic.py
          tests/unit/hosts/test_routing.py
          tests/architecture/test_semantic_index_boundaries.py
