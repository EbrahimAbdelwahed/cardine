name: Reconcile Cardine architecture branch with main

on:
  push:
    branches:
      - agent/cardine-architecture-reliability-latency
    paths:
      - .github/workflows/reconcile-cardine-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: agent/cardine-architecture-reliability-latency
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Merge main and resolve explicit conflicts
        shell: bash
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'merge_status=%s\n' "$merge_status"
          printf 'conflict_count=%s\n' "${#conflicts[@]}"
          printf '%s\n' "${conflicts[@]}"

          for path in "${conflicts[@]}"; do
            # The architecture branch is based on the newer Wave A source of
            # truth. Preserve its version only for paths Git cannot merge;
            # all non-conflicting main changes remain in the merge result.
            if git cat-file -e ":2:${path}" 2>/dev/null; then
              git checkout --ours -- "$path"
              git add -- "$path"
            else
              git rm -- "$path"
            fi
          done

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          git diff --check
          git status --short
      - name: Install locked development environment
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.9.15'
          uv sync --frozen --extra dev
      - name: Verify reconciled tree
        run: |
          uv run --frozen --extra dev python -m ruff check \
            src/cardine/application/conversation_turn.py \
            src/cardine/application/flashcard_proposals.py \
            src/cardine/cli/repository.py \
            src/cardine/hosts/clarification_recovery.py \
            src/cardine/hosts/flashcard_routing.py \
            src/cardine/hosts/runner.py \
            src/cardine/hosts/scope_resolution.py \
            src/cardine/hosts/source_grounding.py \
            src/study_agent/adapters/model/openai_compatible.py \
            src/study_agent/capabilities/contracts.py \
            src/study_agent/capabilities/gateway.py \
            src/study_agent/capabilities/worker_adapter.py \
            src/study_agent/playbooks/engine.py \
            src/study_agent/ports/model.py \
            tests/unit/adapters/model/test_openai_provider_schema_projection.py \
            tests/unit/cardine/test_flashcard_failure_taxonomy.py \
            tests/unit/hosts/test_effect_fast_paths.py \
            tests/unit/hosts/test_scope_resolution.py
          MYPYPATH=src uv run --frozen --extra dev python -m mypy --explicit-package-bases \
            src/cardine/application/conversation_turn.py \
            src/cardine/application/flashcard_proposals.py \
            src/cardine/cli/repository.py \
            src/cardine/hosts/clarification_recovery.py \
            src/cardine/hosts/flashcard_routing.py \
            src/cardine/hosts/runner.py \
            src/cardine/hosts/scope_resolution.py \
            src/cardine/hosts/source_grounding.py \
            src/study_agent/adapters/model/openai_compatible.py \
            src/study_agent/capabilities/contracts.py \
            src/study_agent/capabilities/gateway.py \
            src/study_agent/capabilities/worker_adapter.py \
            src/study_agent/playbooks/engine.py \
            src/study_agent/ports/model.py
          uv run --frozen --extra dev python -m pytest -q \
            tests/unit/adapters/model/test_openai_compatible.py \
            tests/unit/adapters/model/test_openai_luna.py \
            tests/unit/adapters/model/test_tutor_decision.py \
            tests/unit/adapters/model/test_openai_provider_schema_projection.py \
            tests/unit/application/test_conversation_turn.py \
            tests/unit/hosts/test_flashcard_routing_natural_language.py \
            tests/unit/hosts/test_source_grounding.py \
            tests/unit/hosts/test_effect_fast_paths.py \
            tests/unit/hosts/test_scope_resolution.py \
            tests/unit/cardine/test_flashcard_failure_taxonomy.py \
            tests/unit/cardine/test_a2_regressions.py \
            tests/unit/flashcards/test_lesson_worker_service.py \
            tests/integration/demo/TUT08/test_flashcard_proposals.py
      - name: Publish reconciled merge commit
        shell: bash
        run: |
          rm .github/workflows/reconcile-cardine-main.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'merge(main): reconcile current Cardine history'
          git push origin HEAD:agent/cardine-architecture-reliability-latency
