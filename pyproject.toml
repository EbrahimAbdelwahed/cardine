[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cardine"
version = "0.2.0"
description = "Private Cardine study application built on a copied, event-sourced runtime core"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Cardine-Private"
license-files = ["LICENSE", "LICENSE-CARDINE.md", "NOTICE.md"]
authors = [{ name = "Ebrahim Abdelwahed" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/EbrahimAbdelwahed/cardine"
Documentation = "https://github.com/EbrahimAbdelwahed/cardine#readme"
Issues = "https://github.com/EbrahimAbdelwahed/cardine/issues"
Source = "https://github.com/EbrahimAbdelwahed/cardine"

[project.scripts]
# Cardine product entry points.  The implementation modules intentionally keep
# their internal ``study_agent`` namespace and protocol identifiers.
cardine = "study_agent.cli.main:main"
cardine-demo = "study_agent.demo.anatomy:main"
cardine-shell = "study_agent.demo.product_shell:main"
cardine-shell-web = "study_agent.demo.browser:main"
cardine-private-password-hash = "study_agent.demo.private_access:main"

# Compatibility entry points for the copied Harness core.  These aliases are
# not the Cardine product identity, but preserve existing host integrations.
study-agent = "study_agent.cli.main:main"
study-agent-demo = "study_agent.demo.anatomy:main"
study-agent-shell = "study_agent.demo.product_shell:main"
study-agent-shell-web = "study_agent.demo.browser:main"
study-agent-private-password-hash = "study_agent.demo.private_access:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]
openai = ["openai>=2.46,<3"]
recall = ["fsrs==6.3.1"]
pdf = ["pypdf==6.14.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
study_agent = ["py.typed"]
"study_agent.demo" = ["fixtures/*.md", "browser.html", "browser.css", "browser.js", "ai-primitives.css", "ai-primitives.js", "icons/*.svg", "icons/*.txt", "fonts/*.woff2", "fonts/*.txt"]
"study_agent.operator_skill" = ["SKILL.md"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
